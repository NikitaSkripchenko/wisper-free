name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Wisper.xcodeproj \
            -scheme Wisper \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Wisper.xcodeproj \
            -scheme Wisper \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:WisperUITests \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/ci/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project Wisper.xcodeproj \
            -scheme Wisper \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/ci/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: build/ci/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ github.run_id }}
          path: build/ci/DerivedData/Build/Products/Debug/Wisper.app
          if-no-files-found: ignore
          retention-days: 7
