name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, and publish
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag and version
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vX.Y.Z format, got: $RELEASE_TAG" >&2
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{tag}" >/dev/null; then
            echo "Release tag $RELEASE_TAG must exist and be annotated." >&2
            exit 1
          fi

          if ! git tag --points-at HEAD | grep --fixed-strings --line-regexp --quiet "$RELEASE_TAG"; then
            echo "Checked out commit is not the commit tagged by $RELEASE_TAG." >&2
            exit 1
          fi

          git fetch origin main --quiet
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag $RELEASE_TAG must point to a commit on main." >&2
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)
          PROJECT_VERSIONS=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' Wisper.xcodeproj/project.pbxproj | sort -u | paste -sd ' ' -)
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' macos/Info.plist)
          PROJECT_BUILD_NUMBERS=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([^;]*\);/\1/p' Wisper.xcodeproj/project.pbxproj | sort -u | paste -sd ' ' -)

          if [ "$PLIST_VERSION" != "$TAG_VERSION" ] || [ "$PROJECT_VERSIONS" != "$TAG_VERSION" ]; then
            echo "Tag $RELEASE_TAG must match CFBundleShortVersionString ($PLIST_VERSION) and every MARKETING_VERSION ($PROJECT_VERSIONS)." >&2
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "CFBundleVersion must be numeric, got: $BUILD_NUMBER" >&2
            exit 1
          fi

          if [ "$PROJECT_BUILD_NUMBERS" != "$BUILD_NUMBER" ]; then
            echo "CFBundleVersion ($BUILD_NUMBER) must match every CURRENT_PROJECT_VERSION ($PROJECT_BUILD_NUMBERS)." >&2
            exit 1
          fi

          PREVIOUS_TAG=$(git tag --merged "$RELEASE_TAG^" --sort=-version:refname | while read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && git rev-parse --verify --quiet "refs/tags/$tag^{tag}" >/dev/null; then
              echo "$tag"
              break
            fi
          done)
          if [ -n "$PREVIOUS_TAG" ]; then
            PREVIOUS_PLIST=$(mktemp)
            trap 'rm -f "$PREVIOUS_PLIST"' EXIT
            git show "$PREVIOUS_TAG:macos/Info.plist" > "$PREVIOUS_PLIST"
            PREVIOUS_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PREVIOUS_PLIST")
            if [[ ! "$PREVIOUS_BUILD" =~ ^[0-9]+$ ]] || (( 10#$BUILD_NUMBER <= 10#$PREVIOUS_BUILD )); then
              echo "CFBundleVersion ($BUILD_NUMBER) must be greater than the previous release $PREVIOUS_TAG build ($PREVIOUS_BUILD)." >&2
              exit 1
            fi
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "dmg_path=build/dmg/Wisper-$RELEASE_TAG.dmg" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Validate release secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD DEVELOPER_ID_APPLICATION MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Wisper.xcodeproj \
            -scheme Wisper \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:WisperUITests \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build signed and notarized DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          KEYCHAIN_NAME: wisper-ci.keychain
        run: bundle exec fastlane mac build_dmg tag:"${{ steps.release.outputs.tag }}"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bundle exec fastlane mac publish_dmg tag:"${{ steps.release.outputs.tag }}" dmg_path:"${{ steps.release.outputs.dmg_path }}"
